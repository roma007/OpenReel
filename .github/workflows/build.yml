name: Build Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          desktop_id=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').identifier")
          android_pkg=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          ios_bundle=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
          [ "$desktop_id" = "com.movie.app.desktop" ] || { echo "IDENTIFIER CHANGED: desktop identifier=$desktop_id"; exit 1; }
          [ "$android_pkg" = "com.movie.app" ] || { echo "IDENTIFIER CHANGED: android package=$android_pkg"; exit 1; }
          [ "$ios_bundle" = "com.mengfeng.movieapp" ] || { echo "IDENTIFIER CHANGED: ios bundleIdentifier=$ios_bundle"; exit 1; }
          echo "Identifiers OK (desktop=$desktop_id, android=$android_pkg, ios=$ios_bundle)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Build Tauri app
        run: pnpm --filter @openreel/desktop tauri build --target ${{ matrix.target }}
        env:
          # 在线升级签名私钥（tauri.conf.json createUpdaterArtifacts 需要）；
          # 未配置 secrets 时变量为空，tauri 会跳过 .sig 生成，不影响普通产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          desktop_id=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').identifier")
          android_pkg=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          ios_bundle=$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")
          [ "$desktop_id" = "com.movie.app.desktop" ] || { echo "IDENTIFIER CHANGED: desktop identifier=$desktop_id"; exit 1; }
          [ "$android_pkg" = "com.movie.app" ] || { echo "IDENTIFIER CHANGED: android package=$android_pkg"; exit 1; }
          [ "$ios_bundle" = "com.mengfeng.movieapp" ] || { echo "IDENTIFIER CHANGED: ios bundleIdentifier=$ios_bundle"; exit 1; }
          echo "Identifiers OK (desktop=$desktop_id, android=$android_pkg, ios=$ios_bundle)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认值 'tools platform-tools' 中的 tools 包已被 Google 从 SDK 仓库移除，
          # sdkmanager 会因找不到该包退出码 1 而失败，故显式只装 platform-tools。
          packages: 'platform-tools'

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Initialize Android project
        run: |
          if [ ! -d "apps/desktop/src-tauri/gen/android" ]; then
            pnpm --filter @openreel/desktop tauri android init --ci
          else
            echo "Android project already initialized"
          fi

      - name: Build Android APK
        run: pnpm --filter @openreel/desktop tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-Android
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  build-mobile-android:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          android_pkg=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          [ "$android_pkg" = "com.movie.app" ] || { echo "IDENTIFIER CHANGED: android package=$android_pkg"; exit 1; }
          echo "Identifiers OK (android=$android_pkg)"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 版本取自 node_modules/react-native/gradle/libs.versions.toml（compileSdk/targetSdk/buildTools/ndk）
      # 与本机实测一致；CMake 3.22.1 为本机唯一可用版本，与 .cxx/compile_commands.json 记录一致。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      # postinstall 会执行 apply-native-patches.mjs，为 expo-video 注入 maxRequestsPerHost，
      # 必须先 pnpm install 才能拿到带补丁的原生源码，故放在 SDK 安装之后。
      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Build release APK
        run: |
          cd apps/mobile/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-Mobile-Android
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  build-tv-android:
    name: Build TV APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          tv_pkg=$(node -p "require('./apps/tv/app.json').expo.android.package")
          [ "$tv_pkg" = "com.movie.app.tv" ] || { echo "IDENTIFIER CHANGED: tv package=$tv_pkg"; exit 1; }
          echo "Identifiers OK (tv=$tv_pkg)"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 与 build-mobile-android 保持一致（同 monorepo 同一套 RN/Expo 原生依赖）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Build release APK
        run: |
          cd apps/tv/android
          ./gradlew :app:assembleRelease --no-daemon

      # 与手机端 APK 同名（都是 app-release-v<ver>.apk），同 Release 发布会冲突，
      # 上传前重命名为 openreel-tv-release-v<ver>.apk（TV 应用内按此前缀匹配更新资产）。
      - name: Rename APK to avoid mobile name clash
        shell: bash
        run: |
          set -e
          ver=$(node -p "require('./apps/tv/app.json').expo.version")
          dir=apps/tv/android/app/build/outputs/apk/release
          src="$dir/app-release-v${ver}.apk"
          dst="$dir/openreel-tv-release-v${ver}.apk"
          [ -f "$src" ] || { echo "APK not found: $src"; exit 1; }
          mv "$src" "$dst"
          echo "Renamed: $dst"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-TV-Android
          path: apps/tv/android/app/build/outputs/apk/release/openreel-tv-release-v*.apk
          if-no-files-found: warn

  build-tv-launcher-android:
    name: Build TV Launcher APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify app identifiers unchanged
        shell: bash
        run: |
          set -e
          # 升级 vs 重装由系统按「标识符+签名」判定，标识符一旦发布不可更改，否则新装不再覆盖、旧数据丢失。改包名构建直接失败。
          tv_launcher_pkg=$(node -p "require('./apps/tv-launcher/app.json').expo.android.package")
          [ "$tv_launcher_pkg" = "com.movie.app.launcher" ] || { echo "IDENTIFIER CHANGED: tv-launcher package=$tv_launcher_pkg"; exit 1; }
          echo "Identifiers OK (tv-launcher=$tv_launcher_pkg)"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 与 build-mobile-android 保持一致（同 monorepo 同一套 RN/Expo 原生依赖）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for i in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "pnpm install failed (attempt $i/3), cleaning store and retrying..."
            rm -rf node_modules
            pnpm store prune || true
          done
          exit 1

      - name: Build release APK
        run: |
          cd apps/tv-launcher/android
          ./gradlew :app:assembleRelease --no-daemon

      # 与 TV 端/手机端 APK 同名（都是 app-release-v<ver>.apk），同 Release 发布会冲突，
      # 上传前重命名为 openreel-tv-launcher-release-v<ver>.apk（Launcher 应用内按此前缀匹配更新资产）。
      - name: Rename APK to avoid mobile name clash
        shell: bash
        run: |
          set -e
          ver=$(node -p "require('./apps/tv-launcher/app.json').expo.version")
          dir=apps/tv-launcher/android/app/build/outputs/apk/release
          src="$dir/app-release-v${ver}.apk"
          dst="$dir/openreel-tv-launcher-release-v${ver}.apk"
          [ -f "$src" ] || { echo "APK not found: $src"; exit 1; }
          mv "$src" "$dst"
          echo "Renamed: $dst"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-TV-Launcher-Android
          path: apps/tv-launcher/android/app/build/outputs/apk/release/openreel-tv-launcher-release-v*.apk
          if-no-files-found: warn

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # 必须包含两个 Android job：此前只 needs [build]，实测 v1.0.173 的 create-release
    # 06:55:49 跑完，而 Build Android 06:57:41 才结束，APK 尚未上传，Release 里被静默漏掉。
    needs: [build, build-android, build-mobile-android, build-tv-android, build-tv-launcher-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 生成 Tauri updater 清单 latest.json（仅 Windows；macOS 不在在线升级范围）。
      # tauri.conf.json 设 createUpdaterArtifacts: true（v2 默认），Windows 产物为
      # OpenReel-setup.exe + OpenReel-setup.exe.sig（不再打包成 .nsis.zip）。
      # 需要 secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) 配置后构建才会产出 .sig；
      # 未产出时跳过生成，不影响 Release 本身。
      - name: Generate latest.json for updater
        shell: bash
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          # download-artifact + merge-multiple 会平铺所有文件到 artifacts/，子目录结构丢失
          sig_file=$(find artifacts -name "OpenReel-setup.exe.sig" | head -n1)
          if [ -z "$sig_file" ]; then
            echo "No updater signature found, skip latest.json (signing secrets not configured?)"
            exit 0
          fi
          exe_name="OpenReel-setup.exe"
          sig=$(cat "$sig_file")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "version": "%s",\n  "notes": "See the assets below to download and install.",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "https://github.com/roma007/openreel/releases/download/%s/%s"\n    }\n  }\n}\n' \
            "$ver" "$pub_date" "$sig" "$GITHUB_REF_NAME" "$exe_name" > latest.json
          echo "Generated latest.json:"
          cat latest.json

      # 按扩展名白名单取件：此前用 artifacts/**/*，会把 macOS bundle 里 OpenReel.app
      # 目录内部的 Info.plist / icon.icns / *.applescript 等中间产物全部展开成 Release 资产。
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.nsis.zip
            artifacts/**/*.apk
            artifacts/**/*.aab
            latest.json
          name: OpenReel ${{ github.ref_name }}
          body: "See the assets below to download and install."
          draft: false
          prerelease: false
